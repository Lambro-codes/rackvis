<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RackViz Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; flex-direction: column; }
    .header { padding: 8px 12px; background: #111; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header h1 span { color: #3b82f6; }
    .controls { display: flex; gap: 4px; }
    .btn { padding: 5px 10px; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; border-radius: 3px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .btn:hover { background: #252525; }
    .btn.active { background: #3b82f6; border-color: #3b82f6; }
    .btn svg { width: 14px; height: 14px; }
    .main-container { display: flex; flex: 1; min-height: 0; }
    .sidebar { width: 160px; background: #111; border-right: 1px solid #222; padding: 8px; overflow-y: auto; flex-shrink: 0; transition: width 0.2s ease, padding 0.2s ease, opacity 0.2s ease; }
    .sidebar.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; }
    .sidebar h3 { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin: 8px 0 4px; white-space: nowrap; }
    .sidebar h3:first-child { margin-top: 0; }
    .action { display: block; width: 100%; padding: 5px 6px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; border-radius: 3px; cursor: pointer; font-size: 10px; text-align: left; margin-bottom: 2px; white-space: nowrap; }
    .action:hover { background: #222; border-color: #3b82f6; }
    .rack-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #rack-container { flex: 1; min-height: 0; }
    .log { height: 60px; background: #0d0d0d; border-top: 1px solid #222; padding: 4px 8px; overflow-y: auto; font-family: 'SF Mono', monospace; font-size: 9px; flex-shrink: 0; }
    .log.hidden { display: none; }
    .log-entry { padding: 1px 0; display: flex; gap: 6px; opacity: 0.6; }
    .log-time { color: #444; }
    .log-event { color: #3b82f6; min-width: 60px; }
    .log-data { color: #555; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="btn" onclick="toggleSidebar()" title="Toggle Sidebar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <h1><span>Rack</span>Viz</h1>
    </div>
    <div class="controls">
      <button class="btn active" onclick="setTheme('dark')">Dark</button>
      <button class="btn" onclick="setTheme('light')">Light</button>
      <button class="btn" onclick="toggleLabelFormat()">Label Format</button>
      <button class="btn" onclick="toggleLog()">Toggle Log</button>
    </div>
  </header>
  
  <div class="main-container">
    <aside class="sidebar" id="sidebar">
      <h3>View</h3>
      <button class="action" onclick="rack.toggleView()">Toggle Front/Rear</button>
      
      <h3>Devices</h3>
      <button class="action" onclick="addDevice()">Add Device</button>
      <button class="action" onclick="randomizeStatus()">Randomize Status</button>
      <button class="action" onclick="rack.toggleChassis('blade-chassis')">Toggle Chassis</button>
      
      <h3>Highlight</h3>
      <button class="action" onclick="highlightRandom()">Highlight Random</button>
      <button class="action" onclick="rack.clearHighlight()">Clear All</button>
      <button class="action" onclick="rack.search('server')">Search "server"</button>
      
      <h3>Racks</h3>
      <button class="action" onclick="addRack()">Add Rack</button>
      <button class="action" onclick="removeLastRack()">Remove Last</button>
      
      <h3>Options</h3>
      <button class="action" onclick="toggleTooltip()">Toggle Tooltips</button>
      <button class="action" onclick="toggleEmptySlots()">Toggle Empty Slots</button>
    </aside>
    
    <div class="rack-area">
      <div id="rack-container"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
  
  <script type="module">
    import RackViz, { themes } from '../src/index.js';
    
    const demoData = {
      racks: [
        {
          id: 'rack-01',
          label: 'DC1-R01 (Core)',
          height: 42,
          devices: [
            { id: 'patch-1', slot: 1, height: 1, label: 'Patch Panel A1', type: 'patch', status: 'online' },
            { id: 'sw-core-01', slot: 2, height: 1, label: 'core-sw-01.dc1.example.com', type: 'switch', status: 'online', style: { background: '#0d3320', border: '#1a5a3a' } },
            { id: 'sw-core-02', slot: 3, height: 1, label: 'core-sw-02', type: 'switch', status: 'online' },
            { id: 'fw-edge', slot: 5, height: 2, label: 'fw-edge-01', type: 'firewall', status: 'online', style: { background: '#3d1a1a', border: '#6a2a2a' } },
            { id: 'hv-01', slot: 8, height: 2, label: 'hypervisor-01', type: 'server', status: 'online' },
            { id: 'hv-02', slot: 10, height: 2, label: 'hypervisor-02', type: 'server', status: 'warning', style: { border: '#f97316' } },
            { id: 'hv-03', slot: 12, height: 2, label: 'hypervisor-03', type: 'server', status: 'maintenance', style: { pattern: 'stripes', patternColor: 'rgba(139,92,246,0.3)', border: '#8b5cf6' } },
            { id: 'blade-chassis', slot: 15, height: 10, label: 'Blade Enclosure 1', type: 'blade-chassis', status: 'online', chassis: { slots: 16, blades: [
              { id: 'blade-01', slot: 1, label: 'blade-01', status: 'online' },
              { id: 'blade-02', slot: 2, label: 'blade-02', status: 'online' },
              { id: 'blade-03', slot: 3, label: 'blade-03', status: 'offline' },
              { id: 'blade-04', slot: 4, label: 'blade-04', status: 'online' },
              { id: 'blade-05', slot: 5, label: 'blade-05', status: 'warning' },
              { id: 'blade-06', slot: 6, label: 'blade-06', status: 'online' },
              { id: 'blade-07', slot: 7, label: 'blade-07', status: 'online' },
              { id: 'blade-08', slot: 8, label: 'blade-08', status: 'online' },
              { id: 'blade-10', slot: 10, label: 'blade-10', status: 'maintenance' },
              { id: 'blade-12', slot: 12, label: 'blade-12', status: 'online' },
            ]}},
            { id: 'storage-01', slot: 28, height: 4, label: 'ceph-node-01', type: 'storage', status: 'online', style: { background: '#1a1a3d', border: '#3a3a7a' } },
            { id: 'pdu-rear', slot: 35, height: 1, position: 'rear', label: 'PDU-A', type: 'pdu', status: 'online' },
            { id: 'kvm', slot: 36, height: 1, position: 'front', label: 'KVM Console', type: 'kvm', status: 'online' },
            { id: 'gpu-node', slot: 38, height: 4, label: 'gpu-compute-01', type: 'gpu-server', status: 'online', style: { background: 'linear-gradient(135deg, #1a1a2e, #2d1a3d)', border: '#76b900' } }
          ]
        },
        {
          id: 'rack-02',
          label: 'DC1-R02 (Compute)',
          height: 42,
          devices: [
            { id: 'r2-sw', slot: 1, height: 1, label: 'tor-sw-01', type: 'switch', status: 'online' },
            { id: 'r2-hv-01', slot: 3, height: 2, label: 'hypervisor-04', type: 'server', status: 'online' },
            { id: 'r2-hv-02', slot: 5, height: 2, label: 'hypervisor-05', type: 'server', status: 'online' },
            { id: 'r2-hv-03', slot: 7, height: 2, label: 'hypervisor-06', type: 'server', status: 'offline', style: { opacity: 0.5 } },
            { id: 'r2-hv-04', slot: 9, height: 2, label: 'hypervisor-07', type: 'server', status: 'online' },
            { id: 'r2-hv-05', slot: 11, height: 2, label: 'hypervisor-08', type: 'server', status: 'online' },
            { id: 'r2-stor', slot: 14, height: 4, label: 'ceph-node-02', type: 'storage', status: 'online' },
            { id: 'r2-stor2', slot: 18, height: 4, label: 'ceph-node-03', type: 'storage', status: 'online' }
          ]
        }
      ]
    };
    
    const rack = new RackViz('#rack-container', {
      tooltip: { enabled: true, trigger: 'hover', delay: 100 },
      infoPanel: { enabled: true },
      showEmptySlots: true,
      labelFormat: 'label-first',
      unitNumbers: { show: true, position: 'left', direction: 'bottom-up' }
    });
    
    rack.load(demoData);
    
    window.rack = rack;
    window.themes = themes;
    
    // Log
    const logEl = document.getElementById('log');
    function log(event, data) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString()}</span><span class="log-event">${event}</span><span class="log-data">${JSON.stringify(data).slice(0,40)}</span>`;
      logEl.insertBefore(entry, logEl.firstChild);
      if (logEl.children.length > 20) logEl.removeChild(logEl.lastChild);
    }
    
    rack.on('deviceClick', d => log('click', { id: d.id }));
    rack.on('rackClick', r => log('rackClick', { id: r.id }));
    rack.on('viewChange', v => log('view', { view: v }));
    rack.on('chassisExpand', id => log('expand', { id }));
    rack.on('chassisCollapse', id => log('collapse', { id }));
    rack.on('deviceNameCopied', (d, name) => log('copied', { name }));
    rack.on('resize', rect => log('resize', { w: Math.round(rect.width), h: Math.round(rect.height) }));
    
    log('init', { racks: 2 });
    
    // Actions
    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      // Trigger resize after animation
      setTimeout(() => rack.render(), 220);
    };
    
    window.setTheme = function(name) {
      rack.setTheme(name === 'light' ? themes.light : themes.dark);
      document.querySelectorAll('.header .controls .btn').forEach((b, i) => b.classList.toggle('active', i === (name === 'dark' ? 0 : 1)));
    };
    
    window.toggleLog = function() { 
      logEl.classList.toggle('hidden'); 
      setTimeout(() => rack.render(), 10);
    };
    
    let labelFormat = 'label-first';
    window.toggleLabelFormat = function() {
      labelFormat = labelFormat === 'label-first' ? 'type-first' : 'label-first';
      rack.setOption('labelFormat', labelFormat);
    };
    
    window.toggleTooltip = function() {
      rack.setOption('tooltip.enabled', !rack.options.tooltip.enabled);
    };
    
    window.toggleEmptySlots = function() {
      rack.setOption('showEmptySlots', !rack.options.showEmptySlots);
    };
    
    window.addDevice = function() {
      const targetRack = rack.data.racks[Math.floor(Math.random() * rack.data.racks.length)];
      const usedSlots = new Set();
      targetRack.devices.forEach(d => { for (let i = d.slot; i < d.slot + (d.height || 1); i++) usedSlots.add(i); });
      let slot = null;
      for (let i = 1; i <= (targetRack.height || 42); i++) { if (!usedSlots.has(i)) { slot = i; break; } }
      if (slot) rack.addDevice(targetRack.id, { id: 'new-' + Date.now(), slot, height: 1, label: 'new-srv-' + Math.floor(Math.random()*100), type: 'server', status: 'provisioning' });
    };
    
    window.randomizeStatus = function() {
      const statuses = ['online', 'offline', 'idle', 'warning', 'maintenance', 'critical'];
      rack.data.racks.forEach(r => r.devices.forEach(d => {
        if (!d.chassis) rack.updateDevice(d.id, { status: statuses[Math.floor(Math.random() * statuses.length)] });
      }));
    };
    
    window.highlightRandom = function() {
      const all = [];
      rack.data.racks.forEach(r => r.devices.forEach(d => all.push(d)));
      rack.highlight(all[Math.floor(Math.random() * all.length)].id);
    };
    
    let rackNum = 3;
    window.addRack = function() {
      rack.addRack({ id: 'rack-0' + rackNum, label: 'DC1-R0' + rackNum, height: 42, devices: [{ id: 'r' + rackNum + '-sw', slot: 1, height: 1, label: 'tor-sw-0' + rackNum, type: 'switch', status: 'online' }] });
      rackNum++;
    };
    
    window.removeLastRack = function() {
      if (rack.data.racks.length > 1) rack.removeRack(rack.data.racks[rack.data.racks.length - 1].id);
    };
  </script>
</body>
</html>
